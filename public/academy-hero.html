<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WAAW Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #150a24; }
  #scene {
    position: fixed; inset: 0;
    background:
      radial-gradient(120% 100% at 50% 0%, #3a1f66 0%, #241640 40%, #150a24 100%);
  }
  canvas { display: block; }

  /* soft vignette */
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 220px 60px rgba(10,4,20,0.85);
  }

  #overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    padding-bottom: 9vh;
    pointer-events: none; text-align: center;
  }
  .kicker {
    font-family: 'Inter', sans-serif;
    letter-spacing: 0.42em; text-transform: uppercase;
    font-size: 0.72rem; color: #C9A24B;
    opacity: 0; transform: translateY(8px);
    animation: rise 1.1s ease 0.3s forwards;
  }
  .wordmark {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 600; color: #F7F2E9;
    font-size: clamp(2.8rem, 8vw, 5.6rem);
    line-height: 1; margin: 0.35rem 0 0.2rem;
    text-shadow: 0 2px 40px rgba(201,168,76,0.25);
    opacity: 0; transform: translateY(14px);
    animation: rise 1.2s ease 0.5s forwards;
  }
  .rule {
    width: 0; height: 1px; margin: 0.7rem auto 1rem;
    background: linear-gradient(90deg, transparent, #C9A24B, transparent);
    animation: grow 1.4s ease 1s forwards;
  }
  .caption {
    font-family: 'Inter', sans-serif; font-size: clamp(0.85rem, 2.4vw, 1.05rem);
    color: #E4D9C4; min-height: 1.4em; letter-spacing: 0.04em;
  }
  .caption b { color: #C9A24B; font-weight: 600; }
  .sub {
    font-family: 'Inter', sans-serif; font-size: 0.74rem;
    color: rgba(247,242,244,0.55); margin-top: 0.9rem; letter-spacing: 0.16em;
    text-transform: uppercase;
    opacity: 0; animation: fade 1.4s ease 1.6s forwards;
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes grow { to { width: min(320px, 60vw); } }

  .fadeword { transition: opacity 0.5s ease; }
</style>
</head>
<body>
  <div id="scene"></div>
  <div id="vignette"></div>
  <div id="overlay">
    <div class="kicker">We Are All We&rsquo;ve Got</div>
    <h1 class="wordmark">WAAW Academy</h1>
    <div class="rule"></div>
    <div class="caption">Now exploring <b class="fadeword" id="track">the foundations</b></div>
    <div class="sub">Beginner &nbsp;&middot;&nbsp; Intermediate &nbsp;&middot;&nbsp; Advanced</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const GOLD = 0xC9A24B, GOLD_LT = 0xE4CC86, PURPLE = 0x4A2C6D, CREAM = 0xF7F2E9;

    const container = document.getElementById('scene');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x1d0f36, 0.035);

    const camera = new THREE.PerspectiveCamera(
      52, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.6, 13.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // Lights
    scene.add(new THREE.AmbientLight(0x6a4fa0, 0.7));
    const gold = new THREE.PointLight(GOLD, 1.6, 40); gold.position.set(0, 1, 4); scene.add(gold);
    const rim = new THREE.DirectionalLight(0x9b7bd4, 0.8); rim.position.set(-6, 4, -6); scene.add(rim);

    // --- Central emblem ---
    const emblem = new THREE.Group();
    const core = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.5, 1),
      new THREE.MeshStandardMaterial({ color: GOLD, metalness: 0.75, roughness: 0.28,
        emissive: 0x5a4413, emissiveIntensity: 0.6, flatShading: true }));
    emblem.add(core);
    const wire = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.62, 1),
      new THREE.MeshBasicMaterial({ color: GOLD_LT, wireframe: true, transparent: true, opacity: 0.35 }));
    emblem.add(wire);
    scene.add(emblem);

    // Glow sprite behind emblem
    const glowCanvas = document.createElement('canvas'); glowCanvas.width = glowCanvas.height = 256;
    const gctx = glowCanvas.getContext('2d');
    const grad = gctx.createRadialGradient(128,128,10,128,128,128);
    grad.addColorStop(0, 'rgba(201,168,76,0.55)');
    grad.addColorStop(0.4, 'rgba(201,168,76,0.18)');
    grad.addColorStop(1, 'rgba(201,168,76,0)');
    gctx.fillStyle = grad; gctx.fillRect(0,0,256,256);
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: new THREE.CanvasTexture(glowCanvas), blending: THREE.AdditiveBlending,
      transparent: true, depthWrite: false }));
    glow.scale.set(9, 9, 1); glow.position.z = -0.5; scene.add(glow);

    // Orbit rings
    function ring(r, opacity, tilt) {
      const m = new THREE.Mesh(
        new THREE.TorusGeometry(r, 0.012, 8, 120),
        new THREE.MeshBasicMaterial({ color: GOLD, transparent: true, opacity }));
      m.rotation.x = tilt; return m;
    }
    const ringA = ring(3.1, 0.5, Math.PI/2.2);
    const ringB = ring(3.9, 0.28, Math.PI/1.8);
    scene.add(ringA, ringB);

    // --- Course cards ---
    const cards = [
      ['Foundations', GOLD],       ['What Equity Is', GOLD],
      ['How to Raise', PURPLE],    ['The Pitch Deck', PURPLE],
      ['The Documents', PURPLE],   ['Valuation', PURPLE],
      ['Term Sheets', PURPLE],     ['How to Invest', GOLD_LT],
      ['Due Diligence', GOLD_LT],  ['Building a Portfolio', GOLD_LT],
      ['SEIS / EIS', GOLD_LT],     ['Syndicates', GOLD_LT],
    ];

    function cardTexture(title, accent) {
      const c = document.createElement('canvas'); c.width = 512; c.height = 320;
      const x = c.getContext('2d');
      // card body
      x.fillStyle = '#F7F2E9';
      roundRect(x, 8, 8, 496, 304, 26); x.fill();
      // accent header
      x.fillStyle = '#' + accent.toString(16).padStart(6,'0');
      roundRect(x, 8, 8, 496, 74, 26); x.fill();
      x.fillRect(8, 55, 496, 27);
      // header label
      x.fillStyle = 'rgba(255,255,255,0.92)';
      x.font = '500 22px Inter, sans-serif';
      x.fillText('WAAW ACADEMY', 34, 52);
      // title
      x.fillStyle = '#241633';
      x.font = '600 42px "Cormorant Garamond", Georgia, serif';
      wrap(x, title, 34, 160, 440, 46);
      // footer tick
      x.strokeStyle = '#' + accent.toString(16).padStart(6,'0');
      x.lineWidth = 4; x.beginPath(); x.moveTo(34, 268); x.lineTo(120, 268); x.stroke();
      x.fillStyle = '#8a7f74'; x.font = '400 18px Inter, sans-serif';
      x.fillText('Course', 34, 296);
      const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
    }
    function roundRect(x, px, py, w, h, r) {
      x.beginPath();
      x.moveTo(px+r, py); x.arcTo(px+w, py, px+w, py+h, r);
      x.arcTo(px+w, py+h, px, py+h, r); x.arcTo(px, py+h, px, py, r);
      x.arcTo(px, py, px+w, py, r); x.closePath();
    }
    function wrap(ctx, text, x, y, maxW, lh) {
      const words = text.split(' '); let line = '', yy = y;
      for (const w of words) {
        const test = line + w + ' ';
        if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line.trim(), x, yy); line = w + ' '; yy += lh; }
        else line = test;
      }
      ctx.fillText(line.trim(), x, yy);
    }

    const ringGroup = new THREE.Group();
    const N = cards.length, R = 5.2;
    const cardMeshes = [];
    cards.forEach((c, i) => {
      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(2.05, 1.28),
        new THREE.MeshBasicMaterial({ map: cardTexture(c[0], c[1]), transparent: true }));
      const a = (i / N) * Math.PI * 2;
      mesh.userData = { a, yb: Math.sin(i * 1.7) * 0.5 };
      mesh.position.set(Math.cos(a) * R, mesh.userData.yb, Math.sin(a) * R);
      ringGroup.add(mesh); cardMeshes.push(mesh);
    });
    scene.add(ringGroup);

    // --- Particles ---
    const pCount = 380, pPos = new Float32Array(pCount * 3);
    for (let i = 0; i < pCount; i++) {
      const r = 6 + Math.random() * 10, th = Math.random() * Math.PI * 2, ph = Math.acos(2*Math.random()-1);
      pPos[i*3] = r * Math.sin(ph) * Math.cos(th);
      pPos[i*3+1] = (Math.random() - 0.5) * 12;
      pPos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
    }
    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
      color: GOLD_LT, size: 0.05, transparent: true, opacity: 0.7,
      blending: THREE.AdditiveBlending, depthWrite: false }));
    scene.add(particles);

    // --- Caption cycle ---
    const tracks = ['the foundations', 'the founder track', 'the investor track',
                    'raising capital', 'how to invest'];
    let ti = 0; const trackEl = document.getElementById('track');
    setInterval(() => {
      trackEl.style.opacity = 0;
      setTimeout(() => { ti = (ti + 1) % tracks.length; trackEl.textContent = tracks[ti]; trackEl.style.opacity = 1; }, 500);
    }, 2600);

    // --- Animate ---
    let t = 0;
    function animate() {
      requestAnimationFrame(animate);
      t += 0.006;
      emblem.rotation.y = t * 0.6; emblem.rotation.x = Math.sin(t * 0.4) * 0.2;
      wire.rotation.y = -t * 0.3;
      ringGroup.rotation.y = t * 0.28;
      ringA.rotation.z = t * 0.4; ringB.rotation.z = -t * 0.3;
      particles.rotation.y = t * 0.05;
      // billboard cards toward camera + gentle bob
      cardMeshes.forEach((m, i) => {
        m.position.y = m.userData.yb + Math.sin(t * 1.2 + i) * 0.12;
        m.lookAt(camera.position);
      });
      // gentle camera drift
      camera.position.x = Math.sin(t * 0.18) * 1.6;
      camera.position.y = 1.6 + Math.sin(t * 0.25) * 0.4;
      camera.lookAt(0, 0, 0);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
